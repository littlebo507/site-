<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сондор | Admin</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-stone-100"><main class="max-w-6xl mx-auto p-5"><div class="flex justify-between items-center"><div><p class="text-amber-600 font-bold">SONDOR ADMIN</p><h1 class="text-3xl font-black">Захиалгын удирдлага</h1></div><button id="logout" class="hidden bg-stone-900 text-white px-4 py-2 rounded-xl">Гарах</button></div><section id="login" class="max-w-md bg-white p-6 rounded-2xl shadow mt-8"><h2 class="text-xl font-bold">Админ нэвтрэх</h2><input id="email" type="email" placeholder="И-мэйл" class="w-full border p-3 rounded-xl mt-4"><input id="password" type="password" placeholder="Нууц үг" class="w-full border p-3 rounded-xl mt-3"><button id="loginBtn" class="w-full bg-amber-600 text-white p-3 rounded-xl mt-4 font-bold">Нэвтрэх</button><p id="loginMsg" class="text-sm mt-3"></p></section><section id="dashboard" class="hidden mt-8"><div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stats"></div><div id="orders" class="mt-6 grid gap-4"></div></section></main><script type="module" src="./admin.js"></script></body></html>
