<!doctype html><html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMU MALL Admin</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f5faf7]"><div id="login" class="min-h-screen grid place-items-center p-4"><form id="loginForm" class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md"><h1 class="text-3xl font-black">🏬 AMU MALL Admin</h1><p class="text-slate-500 mt-1">Дэлгүүр + мэдээ удирдах</p><input id="email" type="email" required class="w-full border rounded-xl px-4 py-3 mt-6" placeholder="Admin email"><input id="password" type="password" required class="w-full border rounded-xl px-4 py-3 mt-3" placeholder="Нууц үг"><button class="w-full mt-4 py-3 rounded-xl bg-emerald-700 text-white font-black">Нэвтрэх</button><p id="err" class="text-red-500 mt-3 text-sm"></p></form></div><div id="panel" class="hidden max-w-7xl mx-auto p-4 sm:p-6"><div class="flex justify-between items-center mb-6"><div><h1 class="text-3xl font-black">AMU MALL Admin</h1><p class="text-slate-500">Дэлгүүр болон мэдээ</p></div><div class="flex gap-2"><a href="index.html" class="px-4 py-2 rounded-full bg-emerald-50">Сайт</a><button id="logout" class="px-4 py-2 rounded-full bg-slate-200">Гарах</button></div></div><div class="grid lg:grid-cols-2 gap-6"><section class="bg-white p-6 rounded-3xl"><h2 class="text-xl font-black">🏪 Дэлгүүр</h2><form id="shopForm" class="mt-4 space-y-3"><input id="sid" class="w-full border rounded-xl p-3" placeholder="ID (засах үед бөглөнө)"><input id="sname" required class="w-full border rounded-xl p-3" placeholder="Дэлгүүрийн нэр"><select id="scat" class="w-full border rounded-xl p-3"><option>Худалдаа</option><option>Хоол, кофе</option><option>Хүүхэд</option><option>Гоо сайхан</option><option>Бичиг хэрэг</option></select><input id="srating" class="w-full border rounded-xl p-3" placeholder="Үнэлгээ"><input id="sicon" class="w-full border rounded-xl p-3" placeholder="Emoji"><textarea id="sdesc" required class="w-full border rounded-xl p-3" placeholder="Тайлбар"></textarea><input id="sphone" class="w-full border rounded-xl p-3" placeholder="Утас"><input id="slocation" class="w-full border rounded-xl p-3" placeholder="Давхар / лангуу"><button class="w-full py-3 rounded-xl bg-emerald-700 text-white font-black">Хадгалах</button></form><div id="shopAdmin" class="mt-6 space-y-2"></div></section><section class="bg-white p-6 rounded-3xl"><h2 class="text-xl font-black">📰 Шинэ мэдээ</h2><form id="newsForm" class="mt-4 space-y-3"><input id="ntitle" required class="w-full border rounded-xl p-3" placeholder="Гарчиг"><input id="ndate" class="w-full border rounded-xl p-3" placeholder="Огноо"><textarea id="ncontent" required class="w-full border rounded-xl p-3" rows="6" placeholder="Мэдээний агуулга"></textarea><button class="w-full py-3 rounded-xl bg-emerald-700 text-white font-black">Нийтлэх</button></form><div id="newsAdmin" class="mt-6 space-y-2"></div></section></div></div><script type="module" src="admin.js"></script></body></html>
